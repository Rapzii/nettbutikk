<!DOCTYPE html>
<html>
<head>
    <title>Nettbutikk</title>
</head>
<body>
    <h1>Produkter</h1>
    <ul>
        {% for product in products %}
        <li>
            <h2>{{ product[1] }}</h2>
            <p>{{ product[2] }}</p>
            <p>Pris: ${{ product[3] }}</p>
            <p>Lager: {{ product[4] }}</p>
            <img src="{{ product[5] }}" alt="{{ product[1] }}">
        </li>
        {% endfor %}
    </ul>
</body>
</html>
